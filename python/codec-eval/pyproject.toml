[project]
name = "codec-eval"
version = "0.1.0"
description = "Compare candidate array codecs against the shipped HTJ2K encoding for DEFRA terrain tiles"
readme = "README.md"
# imagecodecs wheels lag new interpreters; uv will fetch a supported one.
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "imagecodecs>=2024.1.1",
    "tifffile>=2024.1.1",
]

[project.scripts]
codec-eval = "codec_eval.compare:main"
codec-dither = "codec_eval.dither:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codec_eval"]
